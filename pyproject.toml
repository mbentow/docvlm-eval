[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docvlm-eval"
version = "0.2.0"
description = "Field-level evaluation for document extraction with vision language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mauricio Bento" }]
keywords = ["vlm", "ocr", "evaluation", "document-ai", "benchmark", "ollama"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "pyyaml>=6.0",
  "rich>=13.7",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
corpus = ["pillow>=10.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "matplotlib>=3.8",
  "pillow>=10.0",
]

[project.scripts]
docvlm-eval = "docvlm_eval.cli:app"

[project.urls]
Homepage = "https://github.com/bentow/docvlm-eval"
Issues = "https://github.com/bentow/docvlm-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/docvlm_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.hatch.build.targets.wheel.force-include]
"src/docvlm_eval/py.typed" = "docvlm_eval/py.typed"
