# Portuguese-prompt A/B. Targets a Portuguese-language field schema
# (`procedimentos`, `medico_crm`) that is not part of the bundled corpora, so
# these configs are here as worked examples of prompt iteration, not as runs you
# can reproduce from this repository. The prompts they point at are in prompts/.
name: eco-B
runner: ollama
model: qwen3-vl:30b-a3b-instruct
host: ${OLLAMA_HOST:-http://localhost:11434}
params: { temperature: 0, format: schema, num_ctx: 8192, timeout: 300 }
prompt: ../prompts/pt_B_transcreva_antes.txt
preprocess: none
critical_fields: [medico_crm]
weights: { procedimentos: 0.5 }
